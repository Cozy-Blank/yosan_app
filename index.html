<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <title>偏愛Tool｜日割りメリハリ</title>
  
  <!-- OGP設定（LINE・SNSシェア用） -->
  <meta property="og:title" content="偏愛Tool｜日割りメリハリ">
  <meta property="og:description" content="全体バランスを捨て、一本の「軸」で高く積む。ブーストタイミングを捉えるための仕込み＆日割り予算マネージャー。">
  <meta property="og:site_name" content="偏愛Tool">
  <meta property="og:image" content="https://i.ibb.co/pjGSsHNm/teiku.png">
  <meta property="og:type" content="website">
  
  <!-- Twitter (X) 用カード設定 -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="偏愛Tool｜日割りメリハリ">
  <meta name="twitter:description" content="全体バランスを捨て、一本の「軸」で高く積む。ブーストタイミングを捉えるための仕込み＆日割り予算マネージャー。">
  <meta name="twitter:image" content="https://i.ibb.co/pjGSsHNm/teiku.png">

  <style>
    :root {
      --bg-color: #fff5f7;            /* やわらかいピンク系背景 */
      --card-bg: #ffffff;
      --primary: #f472b6;             /* メインピンク */
      --primary-dark: #db2777;
      --accent: #10b981;
      --text-main: #4a4049;           /* 優しいダークブラウン */
      --text-muted: #9d8b98;
      --border-color: #fbcfe8;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      padding-bottom: 40px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 長方形イラスト枠（外枠・背景） */
    .header-banner-wrapper {
      width: 100%;
      margin-bottom: 2px;
    }

    .header-banner {
      width: 100%;
      aspect-ratio: 4.5 / 1;
      background-color: #ffffff;
      border: 2px solid var(--border-color);
      border-radius: 18px;
      box-shadow: 0 4px 12px rgba(244, 114, 182, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-sizing: border-box;
    }

    .header-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      box-sizing: border-box;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: none;
      border: 2px solid #f472b6;
    }

    /* 縦幅半分のコンパクトカード（一番下段用） */
    .card-compact {
      background: #faf5ff;
      border: 2px solid #f3e8ff;
      border-radius: 14px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .big-number {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .unit {
      font-size: 1rem;
      font-weight: 700;
      margin-left: 2px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .stat-box {
      background: #fff0f6;
      border-radius: 14px;
      padding: 10px;
      text-align: center;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: white; }

    /* タスクメモ・買い物リスト */
    .task-input-container {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .task-input-container input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.85rem;
      outline: none;
      background: #fff0f6;
    }

    .task-input-container select {
      padding: 6px 8px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.8rem;
      background: white;
      font-weight: 700;
      color: var(--text-main);
    }

    .btn-small {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 800;
      border: none;
      background: var(--primary);
      color: white;
      cursor: pointer;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: #fff0f6;
      border-radius: 10px;
      font-size: 0.85rem;
    }

    .task-item.completed span {
      opacity: 0.4;
      text-decoration: line-through;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .task-badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge-buy { background: #d1fae5; color: #065f46; }
    .badge-todo { background: #fef3c7; color: #92400e; }

    /* 電卓風モーダル */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 100;
    }

    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-content {
      width: 100%;
      max-width: 480px;
      background: white;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 20px;
      transform: translateY(100%);
      transition: transform 0.25s ease;
    }

    .modal-overlay.active .modal-content { transform: translateY(0); }

    .calc-display {
      background: #fff0f6;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px;
      text-align: right;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary-dark);
      margin-bottom: 12px;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .calc-btn {
      padding: 14px;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
    }

    .calc-btn.op { background: #fce7f3; color: var(--primary-dark); }
    .calc-btn.add { background: var(--primary); color: white; border: none; grid-column: span 2; }
    .calc-btn.clear { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- ヘッダーイラスト -->
    <div class="header-banner-wrapper">
      <div class="header-banner">
        <img src="https://i.ibb.co/pjGSsHNm/teiku.png" alt="ヘッダー画像" class="header-img">
      </div>
    </div>

    <!-- 1. 本日の使える予算カード -->
    <div class="card">
      <div class="card-title">
        <span>本日の使える予算 (買い物1回分)</span>
        <span style="color: var(--primary-dark); font-size: 0.75rem;">自動計算中</span>
      </div>
      <div id="periodRangeText" style="text-align: center; color: var(--primary-dark); font-weight: 700; font-size: 0.8rem; margin-bottom: 8px;">
        対象期間: ----/--/-- 〜 ----/--/--
      </div>
      <div style="text-align: center; margin: 10px 0;">
        <span id="todayBudget" class="big-number">0</span>
        <span class="unit">円</span>
      </div>
      <div class="stat-grid">
        <div class="stat-box">
          <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700;">残り「使う日」</div>
          <div style="font-size: 1.1rem; font-weight: 800; color: var(--text-main);"><span id="remainingDays">0</span> 日</div>
        </div>
        <div class="stat-box">
          <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700;">残りの生活費</div>
          <div style="font-size: 1.1rem; font-weight: 800; color: var(--text-main);"><span id="remainingBudget">0</span> 円</div>
        </div>
      </div>
      <button id="settleTriggerBtn" class="btn btn-primary" style="margin-top: 12px; width: 100%;" onclick="openCalcModal()">
        本日の買い物を上乗せ・精算
      </button>
      <div id="settledBadge" style="display: none; align-items: center; justify-content: space-between; margin-top: 12px; padding: 10px; background: #fce7f3; border-radius: 12px;">
        <span style="font-size: 0.85rem; font-weight: 700; color: var(--primary-dark);">本日精算済み (利用: <span id="settledTodaySum">0</span>円)</span>
        <button onclick="unsettle()" style="font-size: 0.75rem; background: none; border: none; color: #ef4444; font-weight: 700; cursor: pointer;">取消</button>
      </div>
    </div>

    <!-- 2. 買い物予定・ToDoリストカード（予算カードの直下に配置） -->
    <div class="card">
      <div class="card-title">🛒 買い物予定・ToDoリスト</div>
      <div class="task-input-container">
        <select id="taskCategory">
          <option value="買い物">🛒 買い物</option>
          <option value="ToDo">📝 ToDo</option>
        </select>
        <input type="text" id="taskText" placeholder="買いたいもの・やること...">
        <button class="btn-small" onclick="addTask()">追加</button>
      </div>
      <ul class="task-list" id="taskList"></ul>
    </div>

    <!-- 3. 期間・予算の設定カード -->
    <div class="card">
      <div class="card-title">期間・予算の設定</div>
      
      <!-- 集計の範囲 -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span style="font-size: 0.85rem; font-weight: 700;">集計の範囲</span>
        <select id="periodType" onchange="updateSettings()" style="padding: 6px; border-radius: 8px; border: 1px solid var(--border-color);">
          <option value="monthly">1日〜月末締め</option>
          <option value="customNext">締日指定（例:25日〜）</option>
          <option value="customRange">日付を自由に指定</option>
        </select>
      </div>

      <!-- 自由日付指定 -->
      <div id="customRangeRow" style="display: none; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px;">
        <input type="date" id="startDate" onchange="updateSettings()" style="padding: 6px; border-radius: 8px; border: 1px solid #ccc; width: 45%;">
        〜
        <input type="date" id="endDate" onchange="updateSettings()" style="padding: 6px; border-radius: 8px; border: 1px solid #ccc; width: 45%;">
      </div>

      <!-- 締め日指定 -->
      <div id="startDayRow" style="display: none; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span style="font-size: 0.85rem; font-weight: 700;">開始日（毎月）</span>
        <input type="number" id="startDay" oninput="updateSettings()" style="padding: 6px; border-radius: 8px; border: 1px solid #ccc; text-align: right; width: 80px;">
      </div>

      <!-- 手元管理費 -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span style="font-size: 0.85rem; font-weight: 700;">手元管理費</span>
        <input type="number" id="inputTotal" oninput="updateSettings()" style="padding: 6px; border-radius: 8px; border: 1px solid #ccc; text-align: right; width: 120px;">
      </div>

      <!-- 大型出費 -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span style="font-size: 0.85rem; font-weight: 700;">大型出費 (事前除外)</span>
        <input type="number" id="inputBigExpense" oninput="updateSettings()" style="padding: 6px; border-radius: 8px; border: 1px solid #ccc; text-align: right; width: 120px;">
      </div>

      <!-- 設定日数 -->
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 0.85rem; font-weight: 700;">設定日数</span>
        <input type="number" id="inputDays" oninput="updateSettings()" style="padding: 6px; border-radius: 8px; border: 1px solid #ccc; text-align: right; width: 120px;">
      </div>
    </div>

    <!-- 4. 来月のご偏愛ブーストにまわす（一番下段に移動＆サイズ半分に変更） -->
    <div class="card-compact">
      <div style="font-size: 0.8rem; font-weight: 700; color: #7e22ce;">来月のご偏愛ブーストにまわす</div>
      <div>
        <span id="rewardAmount" style="font-size: 1.2rem; font-weight: 800; color: #7e22ce;">0</span>
        <span style="font-size: 0.85rem; font-weight: 700; color: #7e22ce; margin-left: 2px;">円</span>
      </div>
    </div>
  </div>

  <!-- 電卓モーダル -->
  <div id="calcModal" class="modal-overlay">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span style="font-size: 0.9rem; font-weight: 700;">本日利用分を入力</span>
        <button onclick="closeCalcModal()" style="border: none; background: none; font-size: 1.2rem; cursor: pointer;">✕</button>
      </div>
      <div id="calcDisplay" class="calc-display">0</div>
      <div class="calc-grid">
        <button class="calc-btn clear" onclick="calcInput('C')">C</button>
        <button class="calc-btn op" onclick="calcInput('/')">÷</button>
        <button class="calc-btn op" onclick="calcInput('*')">×</button>
        <button class="calc-btn op" onclick="calcInput('-')">-</button>
        
        <button class="calc-btn" onclick="calcInput('7')">7</button>
        <button class="calc-btn" onclick="calcInput('8')">8</button>
        <button class="calc-btn" onclick="calcInput('9')">9</button>
        <button class="calc-btn op" onclick="calcInput('+')">+</button>
        
        <button class="calc-btn" onclick="calcInput('4')">4</button>
        <button class="calc-btn" onclick="calcInput('5')">5</button>
        <button class="calc-btn" onclick="calcInput('6')">6</button>
        <button class="calc-btn add" onclick="addExpense()">加算</button>
        
        <button class="calc-btn" onclick="calcInput('1')">1</button>
        <button class="calc-btn" onclick="calcInput('2')">2</button>
        <button class="calc-btn" onclick="calcInput('3')">3</button>
        <button class="calc-btn" onclick="calcInput('0')">0</button>
      </div>
      <div style="margin-top: 10px; text-align: right; font-size: 0.85rem; font-weight: 700;">
        本日累計: <span id="calcTodayTotal">0</span> 円
      </div>
      <button class="btn btn-primary" style="margin-top: 12px;" onclick="confirmDailySettle()">精算を確定する</button>
    </div>
  </div>

  <script>
    const DEFAULT_HEADER = 'https://i.ibb.co/pjGSsHNm/teiku.png';

    let state = JSON.parse(localStorage.getItem('nmd_app_state_v4') || 'null') || {
      headerImg: DEFAULT_HEADER,
      periodType: 'monthly',
      startDay: 25,
      startDate: '',
      endDate: '',
      totalBudget: 80000,
      bigExpense: 10000,
      settingDays: 10,
      remainingDays: 10,
      remainingBudget: 70000,
      todaySpentTotal: 0,
      isSettledToday: false,
      rewardFrame: 0,
      tasks: []
    };

    let calcExpr = '0';

    function saveState() {
      localStorage.setItem('nmd_app_state_v4', JSON.stringify(state));
      render();
    }

    function getPeriodRange() {
      const today = new Date();
      let start, end;

      if (state.periodType === 'monthly') {
        start = new Date(today.getFullYear(), today.getMonth(), 1);
        end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
      } else if (state.periodType === 'customRange' && state.startDate && state.endDate) {
        return { 
          startText: state.startDate.replace(/-/g, '/'), 
          endText: state.endDate.replace(/-/g, '/') 
        };
      } else {
        const sDay = Math.min(Math.max(state.startDay || 25, 1), 28);
        if (today.getDate() >= sDay) {
          start = new Date(today.getFullYear(), today.getMonth(), sDay);
          end = new Date(today.getFullYear(), today.getMonth() + 1, sDay - 1);
        } else {
          start = new Date(today.getFullYear(), today.getMonth() - 1, sDay);
          end = new Date(today.getFullYear(), today.getMonth(), sDay - 1);
        }
      }
      return { startText: formatDate(start), endText: formatDate(end) };
    }

    function formatDate(d) {
      return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
    }

    function render() {
      // 設定エリアの初期反映
      if (document.getElementById('periodType')) document.getElementById('periodType').value = state.periodType;
      if (document.getElementById('startDay')) document.getElementById('startDay').value = state.startDay;
      if (document.getElementById('startDate')) document.getElementById('startDate').value = state.startDate || '';
      if (document.getElementById('endDate')) document.getElementById('endDate').value = state.endDate || '';
      if (document.getElementById('inputTotal')) document.getElementById('inputTotal').value = state.totalBudget;
      if (document.getElementById('inputBigExpense')) document.getElementById('inputBigExpense').value = state.bigExpense;
      if (document.getElementById('inputDays')) document.getElementById('inputDays').value = state.settingDays;

      // 表示切替
      if (document.getElementById('startDayRow')) {
        document.getElementById('startDayRow').style.display = state.periodType === 'customNext' ? 'flex' : 'none';
      }
      if (document.getElementById('customRangeRow')) {
        document.getElementById('customRangeRow').style.display = state.periodType === 'customRange' ? 'flex' : 'none';
      }

      // 期間範囲テキストの更新
      const range = getPeriodRange();
      const periodRangeEl = document.getElementById('periodRangeText');
      if (periodRangeEl) {
        periodRangeEl.innerText = `対象期間: ${range.startText} 〜 ${range.endText}`;
      }

      if (document.getElementById('remainingDays')) document.getElementById('remainingDays').innerText = state.remainingDays;
      if (document.getElementById('remainingBudget')) document.getElementById('remainingBudget').innerText = state.remainingBudget.toLocaleString();

      const todayBudget = state.remainingDays > 0 ? Math.floor(state.remainingBudget / state.remainingDays) : 0;
      if (document.getElementById('todayBudget')) document.getElementById('todayBudget').innerText = todayBudget.toLocaleString();
      if (document.getElementById('rewardAmount')) document.getElementById('rewardAmount').innerText = state.rewardFrame.toLocaleString();

      // 精算状態の制御
      if (document.getElementById('settleTriggerBtn') && document.getElementById('settledBadge')) {
        if (state.isSettledToday) {
          document.getElementById('settleTriggerBtn').style.display = 'none';
          document.getElementById('settledBadge').style.display = 'flex';
          if (document.getElementById('settledTodaySum')) {
            document.getElementById('settledTodaySum').innerText = state.todaySpentTotal.toLocaleString();
          }
        } else {
          document.getElementById('settleTriggerBtn').style.display = 'block';
          document.getElementById('settledBadge').style.display = 'none';
        }
      }

      // タスク・買い物リスト表示
      const taskListEl = document.getElementById('taskList');
      if (taskListEl) {
        taskListEl.innerHTML = '';
        if (state.tasks.length === 0) {
          taskListEl.innerHTML = '<li style="text-align:center; color: var(--text-muted); font-size:0.8rem; padding: 6px 0;">リストは空です</li>';
        } else {
          state.tasks.forEach(task => {
            const li = document.createElement('li');
            li.className = `task-item ${task.completed ? 'completed' : ''}`;
            const badgeClass = task.category === '買い物' ? 'badge-buy' : 'badge-todo';
            li.innerHTML = `
              <div class="task-left">
                <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
                <span class="task-badge ${badgeClass}">${task.category}</span>
                <span style="font-weight:700;">${escapeHtml(task.text)}</span>
              </div>
              <button style="color:#ef4444; border:none; background:none; cursor:pointer; font-weight:700; font-size:0.8rem;" onclick="deleteTask(${task.id})">削除</button>
            `;
            taskListEl.appendChild(li);
          });
        }
      }
    }

    function updateSettings() {
      const oldSettingDays = state.settingDays || 1;
      const oldRemainingDays = state.remainingDays;

      state.periodType = document.getElementById('periodType').value;
      state.startDay = Number(document.getElementById('startDay')?.value) || 25;
      state.startDate = document.getElementById('startDate')?.value || '';
      state.endDate = document.getElementById('endDate')?.value || '';
      state.totalBudget = Number(document.getElementById('inputTotal')?.value) || 0;
      state.bigExpense = Number(document.getElementById('inputBigExpense')?.value) || 0;
      
      const newSettingDays = Math.max(1, Number(document.getElementById('inputDays')?.value) || 1);

      const usedDays = oldSettingDays - oldRemainingDays;
      state.settingDays = newSettingDays;
      state.remainingDays = Math.max(0, newSettingDays - usedDays);

      state.remainingBudget = state.totalBudget - state.bigExpense - state.todaySpentTotal;

      saveState();
    }

    document.addEventListener('DOMContentLoaded', () => {
      render();
    });

    /* 電卓・精算・タスク用処理 */
    function openCalcModal() {
      calcExpr = '0';
      updateCalcDisplay();
      if (document.getElementById('calcTodayTotal')) {
        document.getElementById('calcTodayTotal').innerText = state.todaySpentTotal.toLocaleString();
      }
      document.getElementById('calcModal')?.classList.add('active');
    }

    function closeCalcModal() { document.getElementById('calcModal')?.classList.remove('active'); }

    function calcInput(val) {
      if (val === 'C') { calcExpr = '0'; } 
      else {
        if (calcExpr === '0' && !isNaN(val)) calcExpr = val;
        else calcExpr += val;
      }
      updateCalcDisplay();
    }

    function updateCalcDisplay() {
      if (document.getElementById('calcDisplay')) {
        document.getElementById('calcDisplay').innerText = calcExpr;
      }
    }

    function addExpense() {
      try {
        let val = eval(calcExpr.replace(/×/g, '*').replace(/÷/g, '/'));
        if (isNaN(val) || val < 0) val = 0;
        val = Math.floor(val);

        if (val > 0) {
          state.todaySpentTotal += val;
          state.remainingBudget -= val;
          calcExpr = '0';
          updateCalcDisplay();
          if (document.getElementById('calcTodayTotal')) {
            document.getElementById('calcTodayTotal').innerText = state.todaySpentTotal.toLocaleString();
          }
          saveState();
        }
      } catch (e) {
        alert('計算式が正しくありません');
      }
    }

    function confirmDailySettle() {
      addExpense();
      if (!state.isSettledToday) {
        state.isSettledToday = true;
        state.remainingDays = Math.max(0, state.remainingDays - 1);
      }
      closeCalcModal();
      saveState();
    }

    function unsettle() {
      if (confirm('本日の精算を取り消しますか？')) {
        state.remainingBudget += state.todaySpentTotal;
        state.todaySpentTotal = 0;
        state.remainingDays += 1;
        state.isSettledToday = false;
        saveState();
      }
    }

    function addTask() {
      const textEl = document.getElementById('taskText');
      const text = textEl.value.trim();
      const category = document.getElementById('taskCategory').value;
      if (!text) return;
      state.tasks.push({ id: Date.now(), category, text, completed: false });
      textEl.value = '';
      saveState();
    }

    function toggleTask(id) {
      const task = state.tasks.find(t => t.id === id);
      if (task) { task.completed = !task.completed; saveState(); }
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter(t => t.id !== id);
      saveState();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    }
  </script>
</body>
</html>
