<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日割りメリハリアプリ</title>
  <style>
    :root {
      --primary: #ff6b81;
      --primary-hover: #ff4757;
      --bg: #fff0f3;
      --card-bg: #ffffff;
      --text: #2f3542;
      --accent: #ff7854;
      --bubble-bg: #ffeaa7;
      --border-radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    h1 {
      text-align: center;
      color: var(--primary);
      font-size: 1.4rem;
      margin-bottom: 16px;
      font-weight: 800;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(255, 107, 129, 0.12);
      border: 2px solid #ffe0e6;
    }

    .card-title {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: #57606f;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .budget-display {
      text-align: center;
      padding: 12px;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .budget-amount {
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1.2;
    }

    /* ポップでかわいい吹き出し */
    .speech-bubble {
      position: relative;
      background: #fffae6;
      border: 2px solid #ffeaa7;
      color: #d63031;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 8px 12px;
      border-radius: 18px;
      margin-bottom: 10px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(255, 234, 167, 0.5);
      animation: bounce 2s infinite ease-in-out;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 30px;
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #fffae6 transparent;
      display: block;
      width: 0;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    input[type="number"], input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #ffe0e6;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      background: #fff;
      color: var(--text);
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff6b81' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 16px;
      font-weight: bold;
    }

    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn:active {
      background: var(--primary-hover);
    }

    /* ToDo / 買い物リスト */
    .todo-input-group {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff5f7;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      border: 1px solid #ffe0e6;
    }

    .todo-item.completed span {
      text-decoration: line-through;
      color: #b2bec3;
    }

    .todo-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .delete-todo {
      background: none;
      border: none;
      color: #ff7675;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0 4px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #747d8c;
      display: block;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

<h1>🎈 日割りメリハリアプリ</h1>

<!-- 本日の使える予算 -->
<div class="card">
  <div class="card-title">💰 本日の使える予算</div>
  <div class="budget-display">
    <div class="budget-amount" id="dailyBudgetDisplay">¥0</div>
  </div>

  <!-- 買い物リスト・ToDoリスト欄 -->
  <div class="card-title" style="margin-top: 14px;">🛒 本日の買い物・ToDoリスト</div>
  <div class="todo-input-group">
    <input type="text" id="newTodoInput" placeholder="買うものややることを追加...">
    <button class="btn" style="width: 70px; margin-top: 0; padding: 0;" onclick="addTodo()">追加</button>
  </div>
  <ul class="todo-list" id="todoList"></ul>
</div>

<!-- 今期＆ブースト設定 -->
<div class="card">
  <div class="card-title">🏊‍♀️ 流れるプールからやってきた</div>
  
  <!-- ポップでかわいい吹き出し -->
  <div class="speech-bubble">
    来月分にいくらブーストしちゃう？✨
  </div>

  <div class="form-group">
    <label for="boostInput">ブースト金額 (円)</label>
    <input type="number" id="boostInput" placeholder="金額を入力..." onchange="saveData()">
  </div>
</div>

<!-- 基本設定 -->
<div class="card">
  <div class="card-title">⚙️ 基本設定</div>
  
  <div class="form-group">
    <label for="totalBudgetInput">今月の総予算 (円)</label>
    <input type="number" id="totalBudgetInput" placeholder="例: 50000" onchange="saveData()">
  </div>

  <div class="form-group">
    <label for="daysSelect">設定日数 (日)</label>
    <!-- スマホ対応プルダウン化 -->
    <select id="daysSelect" onchange="saveData()">
      <!-- JSで1〜31日を自動生成 -->
    </select>
  </div>
</div>

<script>
  // 初期データ読み込み
  let todos = JSON.parse(localStorage.getItem('merihari_todos') || '[]');

  // 設定日数のプルダウン（1〜31日）を動的生成
  const daysSelect = document.getElementById('daysSelect');
  for (let i = 1; i <= 31; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${i} 日間`;
    if (i === 30) opt.selected = true; // 初期値30日
    daysSelect.appendChild(opt);
  }

  function loadSavedData() {
    const savedBoost = localStorage.getItem('merihari_boost');
    const savedTotal = localStorage.getItem('merihari_total');
    const savedDays = localStorage.getItem('merihari_days');

    if (savedBoost !== null) document.getElementById('boostInput').value = savedBoost;
    if (savedTotal !== null) document.getElementById('totalBudgetInput').value = savedTotal;
    if (savedDays !== null) document.getElementById('daysSelect').value = savedDays;

    calculateBudget();
    renderTodos();
  }

  function saveData() {
    const boost = document.getElementById('boostInput').value;
    const total = document.getElementById('totalBudgetInput').value;
    const days = document.getElementById('daysSelect').value;

    localStorage.setItem('merihari_boost', boost);
    localStorage.setItem('merihari_total', total);
    localStorage.setItem('merihari_days', days);

    calculateBudget();
  }

  function calculateBudget() {
    const total = parseFloat(document.getElementById('totalBudgetInput').value) || 0;
    const boost = parseFloat(document.getElementById('boostInput').value) || 0;
    const days = parseInt(document.getElementById('daysSelect').value) || 1;

    // 予算計算（(総予算 + ブースト) / 日数）
    const daily = Math.floor((total + boost) / days);
    document.getElementById('dailyBudgetDisplay').textContent = `¥${daily.toLocaleString()}`;
  }

  /* ToDo / 買い物リスト機能 */
  function addTodo() {
    const input = document.getElementById('newTodoInput');
    const text = input.value.trim();
    if (!text) return;

    todos.push({ id: Date.now(), text: text, completed: false });
    input.value = '';
    saveAndRenderTodos();
  }

  function toggleTodo(id) {
    todos = todos.map(todo => {
      if (todo.id === id) todo.completed = !todo.completed;
      return todo;
    });
    saveAndRenderTodos();
  }

  function deleteTodo(id) {
    todos = todos.filter(todo => todo.id !== id);
    saveAndRenderTodos();
  }

  function saveAndRenderTodos() {
    localStorage.setItem('merihari_todos', JSON.stringify(todos));
    renderTodos();
  }

  function renderTodos() {
    const listEl = document.getElementById('todoList');
    listEl.innerHTML = '';

    todos.forEach(todo => {
      const li = document.createElement('li');
      li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
      li.innerHTML = `
        <div class="todo-left">
          <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${todo.id})">
          <span>${escapeHtml(todo.text)}</span>
        </div>
        <button class="delete-todo" onclick="deleteTodo(${todo.id})">✕</button>
      `;
      listEl.appendChild(li);
    });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, match => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[match]));
  }

  // 起動時実行
  loadSavedData();
</script>

</body>
</html>
