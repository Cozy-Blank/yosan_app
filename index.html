import os

html_code = """<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>偏愛具 - 予算＆日数管理アプリ</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #bb86fc;
            --accent-variant: #3700b3;
            --secondary-color: #03dac6;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --danger-color: #cf6679;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--accent-color);
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        select, input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #2a2a2a;
            color: var(--text-color);
            font-size: 1rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-box {
            background-color: #252525;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--secondary-color);
            margin-top: 4px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .progress-bar-container {
            width: 100%;
            background-color: #2a2a2a;
            height: 8px;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .period-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            background-color: #252525;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 15px;
        }

        .highlight {
            color: var(--accent-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>偏愛具：期間＆目標アクセラレーター</h1>
        <div class="subtitle">ブレない主軸で、ブーストを仕込む</div>
    </header>

    <!-- 集計期間・目標設定 -->
    <section class="card">
        <div class="card-title">
            <span>期間＆予算設定</span>
        </div>

        <div class="setting-group">
            <label for="period-type">締め日タイプ</label>
            <select id="period-type" onchange="updateSettings()">
                <option value="end-of-month">月末締め（1日〜末日）</option>
                <option value="custom-next">指定日締め（〇日〜翌月〇-1日）</option>
                <option value="custom-current">指定日締め（前月〇日〜当月〇-1日）</option>
            </select>
        </div>

        <div class="setting-group" id="day-select-group" style="display: none;">
            <label for="start-day">開始日（〇日）</label>
            <input type="number" id="start-day" min="1" max="28" value="25" onchange="updateSettings()">
        </div>

        <div class="grid-2">
            <div class="setting-group">
                <label for="total-budget">今期の予算上限 (円)</label>
                <input type="number" id="total-budget" value="100000" onchange="updateSettings()">
            </div>
            <div class="setting-group">
                <label for="reward-rate">ご褒美枠設定 (%)</label>
                <input type="number" id="reward-rate" value="15" min="0" max="50" onchange="updateSettings()">
            </div>
        </div>
    </section>

    <!-- ダッシュボード -->
    <section class="card">
        <div class="card-title">
            <span>進行状況・日割り指標</span>
        </div>

        <div class="period-info">
            対象期間: <span id="period-range-display" class="highlight">-</span>
        </div>

        <div class="grid-2" style="margin-bottom: 10px;">
            <div class="stat-box">
                <div class="stat-label">経過日数 / 全日数</div>
                <div class="stat-value" id="days-progress">- / -</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">残り日数</div>
                <div class="stat-value" id="days-remaining">- 日</div>
            </div>
        </div>

        <div class="grid-2" style="margin-bottom: 10px;">
            <div class="stat-box">
                <div class="stat-label">基本枠（生活用）</div>
                <div class="stat-value" id="base-budget-display">-</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">ご褒美枠（ブースト用）</div>
                <div class="stat-value" id="reward-budget-display" style="color: var(--accent-color);">-</div>
            </div>
        </div>

        <div class="stat-box" style="margin-top: 10px;">
            <div class="stat-label">今日使える基本目安額（1日あたり）</div>
            <div class="stat-value" id="daily-allowance" style="font-size: 1.8rem;">-</div>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="time-progress-bar"></div>
        </div>
    </section>

    <script>
        function updateSettings() {
            const periodType = document.getElementById('period-type').value;
            const dayGroup = document.getElementById('day-select-group');
            const startDayInput = parseInt(document.getElementById('start-day').value) || 25;
            const totalBudget = parseInt(document.getElementById('total-budget').value) || 0;
            const rewardRate = parseInt(document.getElementById('reward-rate').value) || 0;

            if (periodType === 'end-of-month') {
                dayGroup.style.display = 'none';
            } else {
                dayGroup.style.display = 'block';
            }

            const today = new Date();
            let startDate, endDate;

            if (periodType === 'end-of-month') {
                startDate = new Date(today.getFullYear(), today.getMonth(), 1);
                endDate = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            } else if (periodType === 'custom-next') {
                if (today.getDate() >= startDayInput) {
                    startDate = new Date(today.getFullYear(), today.getMonth(), startDayInput);
                    endDate = new Date(today.getFullYear(), today.getMonth() + 1, startDayInput - 1);
                } else {
                    startDate = new Date(today.getFullYear(), today.getMonth() - 1, startDayInput);
                    endDate = new Date(today.getFullYear(), today.getMonth(), startDayInput - 1);
                }
            } else if (periodType === 'custom-current') {
                if (today.getDate() >= startDayInput) {
                    startDate = new Date(today.getFullYear(), today.getMonth(), startDayInput);
                    endDate = new Date(today.getFullYear(), today.getMonth() + 1, startDayInput - 1);
                } else {
                    startDate = new Date(today.getFullYear(), today.getMonth() - 1, startDayInput);
                    endDate = new Date(today.getFullYear(), today.getMonth(), startDayInput - 1);
                }
            }

            // 日数計算
            const totalTime = endDate.getTime() - startDate.getTime();
            const totalDays = Math.ceil(totalTime / (1000 * 3600 * 24)) + 1;

            const elapsedTime = today.getTime() - startDate.getTime();
            let elapsedDays = Math.floor(elapsedTime / (1000 * 3600 * 24)) + 1;
            if (elapsedDays < 1) elapsedDays = 1;
            if (elapsedDays > totalDays) elapsedDays = totalDays;

            const remainingDays = totalDays - elapsedDays + 1;

            // 表示更新
            const formatDate = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
            document.getElementById('period-range-display').textContent = `${formatDate(startDate)} 〜 ${formatDate(endDate)}`;
            document.getElementById('days-progress').textContent = `${elapsedDays} / ${totalDays}日`;
            document.getElementById('days-remaining').textContent = `${remainingDays} 日`;

            // 予算計算
            const rewardBudget = Math.floor(totalBudget * (rewardRate / 100));
            const baseBudget = totalBudget - rewardBudget;
            const dailyAllowance = Math.floor(baseBudget / totalDays);

            document.getElementById('base-budget-display').textContent = `¥${baseBudget.toLocaleString()}`;
            document.getElementById('reward-budget-display').textContent = `¥${rewardBudget.toLocaleString()}`;
            document.getElementById('daily-allowance').textContent = `¥${dailyAllowance.toLocaleString()}`;

            // プログレスバー
            const progressPercent = Math.min(100, Math.max(0, (elapsedDays / totalDays) * 100));
            document.getElementById('time-progress-bar').style.width = `${progressPercent}%`;
        }

        // 初期化実行
        updateSettings();
    </script>
</body>
</html>
"""

with open("henaigu_budget_app.html", "w", encoding="utf-8") as f:
    f.write(html_code)
